function render() {
 document.documentElement.lang = language;
 document.querySelectorAll('[data-copy]').forEach(element => element.textContent=text(element.dataset.copy));
 document.querySelectorAll('[data-language]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.language===language)));
 $('.tabs').setAttribute('aria-label',text('modes'));
 $('.chips').setAttribute('aria-label',text('filters'));
 for (const tab of tabs) {
  const active = tab.id === 'tab-'+mode;
  tab.setAttribute('aria-selected',String(active)); tab.tabIndex = active ? 0 : -1;
  document.getElementById(tab.getAttribute('aria-controls')).hidden = !active;
 }
 document.body.classList.toggle('change',mode==='change');
 if (mode === 'earth') {
  const chips = topics.map(([icon,es,en],i) => {
   const button = node('button','',(category===i?'✓ ':icon+' ')+(language==='es'?es:en)+' '+(i?data.earth[i-1].length:all.length));
   button.type='button'; button.setAttribute('aria-pressed',String(category===i));
   button.onclick=()=>{category=i; render(); $('.chips').children[i].focus();};
   return button;
  });
  $('.chips').replaceChildren(...chips);
  $('.hint').textContent = topics[category][language==='es'?3:4];
  $('.queue').replaceChildren(...queue().map((track,i)=>card(track,i,false)));
  $('#related-earth').textContent = text('related')+' · '+itemText(data.change[links[category]].area);
 } else {
  $('.grid').replaceChildren(...data.change.map((track,i)=>card(track,i,true)));
 }
 renderPreview(); update();
}
function renderPreview() {
 const image = node('img'); image.src = poster(current); image.alt = ''; image.decoding = 'async';
 const button = node('button','',text('details')); button.type='button'; button.onclick=showDetails;
 $('.preview').replaceChildren(video.hasAttribute('src') && !dialog.open ? video : image,node('h2','',itemText(current.title)),node('p','meta',text('pending')),button);
}
function select(track) {
 if (track.id === current.id) return;
 video.pause(); video.removeAttribute('src'); video.load();
 current=track; fallback=false; failed=false;
 video.replaceChildren();
 $('#sheet-media').replaceChildren();
 renderPreview(); update();
}
function switchMode(next,focus=true) {
 mode=next; render();
 if (focus) $('#tab-'+next).focus();
}
function showDetails() {
 if (video.hasAttribute('src')) $('#sheet-media').append(video);
 dialog.showModal();
}
function play() {
 if (failed) {video.removeAttribute('src'); failed=false;}
 if (!video.hasAttribute('src')) {
  fallback=false; video.poster=poster(current);
  video.src=src();
  if (current.captions) for (const [lang,url] of Object.entries(current.captions)) {
   const track=node('track'); track.kind='captions'; track.srclang=lang; track.label=lang==='es'?'Español':'English'; track.src=url; video.append(track);
  }
 }
 if (dialog.open) $('#sheet-media').append(video);
 else if (mode === 'earth') renderPreview();
 else showDetails();
 void video.play().catch(()=>update());
}
$('#toggle').onclick=$('#sheet-toggle').onclick=()=>video.paused||video.ended?play():video.pause();
$('#details').onclick=showDetails;
$('#close').onclick=()=>dialog.close();
dialog.addEventListener('close',()=>{if(mode==='earth')renderPreview();});
$('#related-earth').onclick=()=>{select(data.change[links[category]]);switchMode('change');$('.grid').children[links[category]].focus();};
$('#related-change').onclick=()=>switchMode('earth');
for (const event of ['play','pause','ended']) video.addEventListener(event,update);
video.addEventListener('error',()=>{
 if (current.fallbackSrc && !fallback) {fallback=true;video.src=current.fallbackSrc;void video.play().catch(()=>update());return;}
 failed=true; update();
});
video.addEventListener('loadedmetadata',()=>{
 if (!Number.isFinite(video.duration)) return;
 const seconds=Math.round(video.duration);
 durations.set(current.id,Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0'));update();
});
for (const tab of tabs) {
 tab.onclick=()=>switchMode(tab.id.slice(4));
 tab.onkeydown=event=>{
  const index=tabs.indexOf(tab);
  const next={ArrowLeft:1-index,ArrowRight:1-index,Home:0,End:1}[event.key];
  if(next===undefined)return;
  event.preventDefault(); switchMode(tabs[next].id.slice(4));
 };
}
for (const button of document.querySelectorAll('[data-language]')) button.onclick=()=>{language=button.dataset.language;render();};
render();
</script>
</html>
